<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mega Sena App</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="container">
    <h2>Gerador Mega Sena</h2>

    <div class="top-bar">
        <button onclick="logout()">Sair</button>
    </div>

    <label>Quantidade de jogos:</label>
    <input type="number" id="numJogos" min="1" value="1">

    <button onclick="gerarJogos()">Gerar Jogos</button>

    <div id="result"></div>

    <h3>Jogos Salvos</h3>
    <div id="savedGames"></div>
</div>

<!-- ORDEM DOS SCRIPTS É CRÍTICA -->
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/games.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
