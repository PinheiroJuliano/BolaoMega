<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bolão Mega Sena</title>
    <link rel="stylesheet" href="../css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <main class="app-shell">
        <header class="app-topbar">
            <div>
                <span class="eyebrow">Mega Sena</span>
                <h1>Seu bolão</h1>
            </div>
            <button class="btn-ghost" type="button" onclick="logout()">Sair</button>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <span>Jogos salvos</span>
                <strong id="totalGamesStat">0</strong>
            </div>
            <div class="stat-card">
                <span>Última geração</span>
                <strong id="lastGeneratedStat">-</strong>
            </div>
            <div class="stat-card">
                <span>Status</span>
                <strong id="statusStat">Pronto</strong>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Gerar apostas</h2>
                <span class="status-pill">Rápido</span>
            </div>

            <div class="generator-controls">
                <label class="field">
                    <span>Quantidade de jogos</span>
                    <input type="number" id="numJogos" min="1" value="1" max="20">
                </label>

                <button class="btn-primary" type="button" onclick="gerarJogos()">Gerar números</button>
            </div>

            <div id="result"></div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Meus jogos</h2>
            </div>
            <div id="savedGames" class="games-list"></div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/games.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
